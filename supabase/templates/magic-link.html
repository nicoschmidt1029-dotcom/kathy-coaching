<!doctype html>
<html lang="en">
  <body style="margin:0;background:#f5f0e8;color:#252927;font-family:Arial,sans-serif;padding:32px 16px">
    <table role="presentation" style="width:100%;max-width:560px;margin:0 auto;background:#fbf8f2;border:1px solid #ded6c9;border-radius:20px">
      <tr>
        <td style="padding:40px">
          <p style="margin:0 0 10px;color:#8a725d;font-size:12px;letter-spacing:2px;text-transform:uppercase">Katey Coaching</p>
          <h1 style="margin:0 0 16px;font-family:Georgia,serif;font-weight:400;font-size:32px;color:#3f3540">Your secure admin login</h1>
          <p style="margin:0 0 26px;line-height:1.6;color:#555">Use the button below to sign in. This link is personal, can only be used once and expires automatically.</p>
          <a href="{{ .SiteURL }}/admin/auth/confirm?token_hash={{ .TokenHash }}&type=email" style="display:inline-block;background:#3f3540;color:#fff;text-decoration:none;padding:14px 20px;border-radius:12px">Log in securely</a>
          <p style="margin:26px 0 0;font-size:12px;line-height:1.5;color:#777">If you did not request this email, you can safely ignore it.</p>
        </td>
      </tr>
    </table>
  </body>
</html>
